<!DOCTYPE html>
<html>
<head>
  <title>Crane Manager Login</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;

      /* Thoothukudi Harbour Background */
      background: url('download.jpg') no-repeat center center/cover;

      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Dark overlay */
    body::before {
      content: "";
      position: absolute;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.6);
      top: 0;
      left: 0;
      z-index: 0;
    }

    .container {
      position: relative;
      z-index: 1;
      background: rgba(0,0,0,0.7);
      padding: 30px;
      border-radius: 15px;
      text-align: center;
      color: white;
      width: 320px;
      box-shadow: 0 0 25px rgba(0,0,0,0.9);
    }

    h2 {
      margin-bottom: 20px;
    }

    input {
      width: 90%;
      padding: 10px;
      margin: 10px 0;
      border-radius: 5px;
      border: none;
    }

    button {
      padding: 10px 20px;
      background: orange;
      border: none;
      border-radius: 5px;
      color: black;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: darkorange;
    }

    .icon {
      font-size: 40px;
      margin-bottom: 10px;
    }

    .footer {
      margin-top: 10px;
      font-size: 12px;
      color: #ccc;
    }
  </style>
</head>

<body>

<div class="container">
  <div class="icon">🏗️</div>
  <h2>Crane Manager Login</h2>

  <input type="text" id="managerUser" placeholder="Username">
  <input type="password" id="managerPass" placeholder="Password">

  <button onclick="managerLogin()">Login</button>

  <div class="footer">Thoothukudi Harbour Operations</div>
</div>

<script>
function managerLogin() {
    let user = document.getElementById("managerUser").value;
    let pass = document.getElementById("managerPass").value;

    if(user === "crane_manager" && pass === "lift@2026"){
        window.location.href = "dashboard.html";
    } else {
        alert("Invalid Credentials ⚠️");
    }
}
</script>

</body>
</html>
